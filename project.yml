name: Maps
options:
  bundleIdPrefix: org.openmaps
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.8.0
targets:
  Maps:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Resources
        type: folder
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openmaps.localmaps
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Карты
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Показать вас на карте. Данные не покидают устройство."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
